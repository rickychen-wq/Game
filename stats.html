<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>任務板・數據儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07080d;
    --panel-1:#10121c;
    --panel-2:#0b0d14;
    --line:rgba(233,196,106,.16);
    --line-soft:rgba(233,196,106,.10);
    --gold:#e9c46a;
    --gold-hi:#f7e3a1;
    --gold-deep:#c9a227;
    --gold-dim:#8a7a4a;
    --cyan:#5ff0dc;
    --pink:#ff6b81;
    --purple:#c9a0ff;
    --text:#e8eaf2;
    --muted:#757b90;
    --dim:#454a5e;
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overscroll-behavior-y:none; }
  body {
    font-family:'Noto Sans TC', sans-serif;
    background:var(--bg); color:var(--text);
    height:100dvh;
    min-height:-webkit-fill-available;
    overflow:hidden;
    position:relative;
    display:flex; flex-direction:column;
  }
  body::after{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(120% 50% at 50% -8%, rgba(233,196,106,.09), transparent 55%),
      linear-gradient(rgba(233,196,106,.028) 1px, transparent 1px) 0 0/100% 40px,
      linear-gradient(90deg, rgba(233,196,106,.028) 1px, transparent 1px) 0 0/40px 100%;
  }
  body::before{
    content:''; position:fixed; inset:0; z-index:9999; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.14) 2px 4px);
    opacity:.45;
  }
  header, main { position:relative; z-index:1; }

  /* ===== 密碼鎖 ===== */
  #lock{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px;
  }
  #lock .ic{ font-size:46px; filter:drop-shadow(0 4px 18px rgba(233,196,106,.35)); }
  #lock h1{ font-family:var(--mono); font-size:22px; font-weight:800; letter-spacing:5px; color:var(--gold); }
  #lock .hint{ font-family:var(--mono); color:var(--muted); font-size:12px; letter-spacing:2px; margin-top:-8px; }
  #pw{
    font-family:var(--mono); font-size:18px; letter-spacing:3px; padding:13px 16px; border-radius:10px;
    border:1px solid var(--line); width:min(280px,82vw); text-align:center; background:#0c0e15; color:var(--text);
  }
  #pw:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(233,196,106,.12); }
  #pwBtn{
    width:min(280px,82vw); padding:13px; border:none; border-radius:10px; cursor:pointer;
    background:linear-gradient(180deg,var(--gold-hi),var(--gold-deep)); color:#1a1206;
    font-family:var(--mono); font-size:16px; font-weight:800; letter-spacing:3px;
  }
  #pwMsg{ font-family:var(--mono); font-size:13px; color:var(--pink); min-height:18px; }

  header{
    flex-shrink:0;
    padding:18px 20px 14px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#0a0b12 40%, rgba(7,8,13,.8));
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  header .htxt{ font-family:var(--mono); font-size:16px; font-weight:800; letter-spacing:2px; color:var(--gold); }
  header .htag{ font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--gold-dim);
    border:1px solid var(--line); padding:2px 8px; border-radius:5px; }

  main{
    flex:1; min-height:0; width:100%; max-width:1100px; margin:0 auto;
    overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain;
    padding:16px 16px calc(24px + env(safe-area-inset-bottom));   /* B-2 ③ safe-area */
  }

  /* 誠實標示列 */
  .notice{
    font-family:var(--mono); font-size:11.5px; line-height:1.7; color:var(--gold-dim);
    background:rgba(233,196,106,.06); border:1px dashed var(--line);
    border-radius:10px; padding:11px 14px; margin-bottom:18px;
  }

  section{
    position:relative; background:linear-gradient(160deg,var(--panel-1),var(--panel-2));
    border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:18px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 6px 20px rgba(0,0,0,.4);
  }
  section::before, section::after{
    content:''; position:absolute; width:12px; height:12px; pointer-events:none;
    border:1.5px solid rgba(233,196,106,.5);
  }
  section::before{ top:-1px; left:-1px; border-right:0; border-bottom:0; border-top-left-radius:12px; }
  section::after{ bottom:-1px; right:-1px; border-left:0; border-top:0; border-bottom-right-radius:12px; }
  section > h2{
    font-family:var(--mono); font-size:12.5px; font-weight:700; color:var(--gold); letter-spacing:1.5px;
    display:flex; align-items:center; gap:8px; padding-bottom:11px; margin-bottom:14px;
    border-bottom:1px dashed var(--line); flex-wrap:wrap;
  }
  section > h2::before{ content:'▍'; }
  h3{ font-family:var(--mono); font-size:11.5px; color:var(--gold-dim); letter-spacing:1px;
    margin:18px 0 9px; font-weight:700; }

  /* 總覽卡 */
  .kpiGrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .kpi{
    background:linear-gradient(160deg,#141722,#0c0e15); border:1px solid var(--line-soft);
    border-radius:10px; padding:15px 16px;
  }
  .kpi .k{ font-family:var(--mono); font-size:10.5px; color:var(--muted); letter-spacing:1px; }
  .kpi .v{ font-family:var(--mono); font-size:26px; font-weight:800; color:var(--gold); margin:6px 0 4px;
    font-variant-numeric:tabular-nums; word-break:break-all; }
  .kpi .d{ font-size:11px; color:var(--dim); line-height:1.6; }
  .kpi.pink .v{ color:var(--pink); }
  .kpi.cyan .v{ color:var(--cyan); }

  /* 切換鈕 */
  .seg{ display:flex; gap:6px; flex-wrap:wrap; }
  .seg button{
    padding:6px 13px; border:1px solid var(--line); border-radius:8px; cursor:pointer;
    background:#0d0f17; color:var(--muted); font-family:var(--mono); font-size:11.5px; font-weight:700;
  }
  .seg button.on{ background:linear-gradient(180deg,var(--gold-hi),var(--gold-deep)); color:#1a1206; border-color:transparent; }
  .spacer{ flex:1; }

  svg{ width:100%; height:auto; display:block; }
  .axis{ font-family:var(--mono); font-size:9px; fill:var(--dim); }
  .grid{ stroke:rgba(233,196,106,.10); stroke-width:1; }

  .legend{ display:flex; gap:16px; flex-wrap:wrap; margin-top:10px;
    font-family:var(--mono); font-size:11px; color:var(--muted); }
  .legend i{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }

  .sub{ font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.8; }
  .empty{ font-family:var(--mono); color:var(--dim); font-size:12px; text-align:center;
    padding:26px 0; letter-spacing:1px; }

  /* 橫向長條 */
  .hbar{ margin-bottom:9px; }
  .hbar .t{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:11.5px;
    color:var(--text); margin-bottom:4px; gap:10px; }
  .hbar .t b{ color:var(--gold); font-weight:800; white-space:nowrap; }
  .hbar .track{ height:8px; background:#12141d; border-radius:99px; overflow:hidden; border:1px solid var(--line-soft); }
  .hbar .fill{ height:100%; background:linear-gradient(90deg,var(--gold-deep),var(--gold-hi)); }
  .hbar.pink .fill{ background:linear-gradient(90deg,#b03a4c,var(--pink)); }
  .hbar.cyan .fill{ background:linear-gradient(90deg,#1a7a70,var(--cyan)); }

  /* 表格 */
  .tblWrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12px; min-width:420px; }
  th, td{ padding:9px 10px; text-align:left; border-bottom:1px solid var(--line-soft); white-space:nowrap; }
  th{ color:var(--gold); font-weight:700; font-size:11px; letter-spacing:1px; }
  td.k{ color:var(--muted); }
  tbody tr:hover{ background:rgba(233,196,106,.04); }

  /* 罰單時間軸 */
  .tl{ position:relative; padding-left:18px; }
  .tl::before{ content:''; position:absolute; left:4px; top:4px; bottom:4px; width:1px; background:var(--line); }
  .tlItem{ position:relative; padding:9px 0 9px 4px; }
  .tlItem::before{ content:''; position:absolute; left:-18px; top:14px; width:9px; height:9px; border-radius:50%;
    background:var(--gold); box-shadow:0 0 8px rgba(233,196,106,.6); }
  .tlItem.lock::before{ background:var(--pink); box-shadow:0 0 8px rgba(255,107,129,.6); }
  .tlItem .d{ font-family:var(--mono); font-size:10.5px; color:var(--dim); }
  .tlItem .m{ font-size:13.5px; font-weight:800; margin-top:2px; }
  .tlItem .s{ font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:2px; }

  .pill{ display:inline-block; font-family:var(--mono); font-size:10.5px; font-weight:700;
    padding:2px 8px; border-radius:5px; margin-left:6px; }
  .pill.gold{ background:rgba(233,196,106,.12); color:var(--gold); border:1px solid rgba(233,196,106,.28); }
  .pill.pink{ background:rgba(255,107,129,.12); color:var(--pink); border:1px solid rgba(255,107,129,.3); }
  .pill.cyan{ background:rgba(95,240,220,.12); color:var(--cyan); border:1px solid rgba(95,240,220,.3); }

  .pcard{ border:1px solid var(--line-soft); border-radius:10px; padding:14px; margin-bottom:12px;
    background:linear-gradient(160deg,#141722,#0c0e15); }
  .pcard .pn{ font-size:15px; font-weight:900; margin-bottom:8px; }

  /* ===== 活動控制台 ===== */
  .buffGrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .buffCell{ padding:12px; border-radius:10px; text-align:center;
    background:linear-gradient(160deg,#141722,#0c0e15); border:1px solid var(--line-soft); }
  .buffCell.on{ border-color:rgba(233,196,106,.6); box-shadow:0 0 16px rgba(233,196,106,.18);
    background:linear-gradient(160deg,#241d0e,#14100a); }
  .buffCell .bk{ font-family:var(--mono); font-size:10px; color:var(--muted); letter-spacing:1px; }
  .buffCell .bv{ font-family:var(--mono); font-size:20px; font-weight:800; color:var(--dim); margin-top:4px; }
  .buffCell.on .bv{ color:var(--gold); }

  .evRow{ padding:13px 14px; border-radius:10px; margin-bottom:10px;
    background:linear-gradient(160deg,#141722,#0c0e15); border:1px solid var(--line-soft); }
  .evRow.live{ border-color:rgba(233,196,106,.65); box-shadow:0 0 20px rgba(233,196,106,.2); }
  .evRow.expired{ border-color:rgba(255,107,129,.5); }
  .evTop{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .evTop .ei{ font-size:20px; }
  .evTop .en{ font-size:15px; font-weight:900; }
  .evTop .ef{ font-family:var(--mono); font-size:11px; color:var(--muted); }
  .evSt{ margin-left:auto; font-family:var(--mono); font-size:10.5px; font-weight:800;
    padding:3px 9px; border-radius:5px; }
  .evSt.off{ background:#1a1d28; color:var(--dim); border:1px solid var(--line-soft); }
  .evSt.live{ background:rgba(233,196,106,.14); color:var(--gold); border:1px solid rgba(233,196,106,.4); }
  .evSt.exp{ background:rgba(255,107,129,.14); color:var(--pink); border:1px solid rgba(255,107,129,.4); }
  .evCtl{ display:flex; align-items:center; gap:7px; margin-top:11px; flex-wrap:wrap; }
  .evCtl .dur{ display:flex; gap:5px; flex-wrap:wrap; }
  .evCtl .dur button{ padding:5px 11px; border:1px solid var(--line); border-radius:7px; cursor:pointer;
    background:#0d0f17; color:var(--muted); font-family:var(--mono); font-size:11px; font-weight:700; }
  .evCtl .dur button.on{ background:linear-gradient(180deg,var(--gold-hi),var(--gold-deep));
    color:#1a1206; border-color:transparent; }
  .evCtl input[type=datetime-local]{ background:#0d0f17; color:var(--text); border:1px solid var(--line);
    border-radius:7px; padding:5px 8px; font-family:var(--mono); font-size:11px; }
  .evBtn{ margin-left:auto; padding:8px 16px; border:none; border-radius:8px; cursor:pointer;
    font-family:var(--mono); font-size:12.5px; font-weight:800; }
  .evBtn.go{ background:linear-gradient(180deg,var(--gold-hi),var(--gold-deep)); color:#1a1206; }
  .evBtn.stop{ background:rgba(255,107,129,.15); color:var(--pink); border:1px solid rgba(255,107,129,.4); }

  /* ===== ☢️ DEBUG ZONE（與統計區視覺明顯區隔）===== */
  #debugZone{
    border:2px solid rgba(255,107,129,.65); border-radius:14px; padding:18px; margin-top:34px;
    background:
      repeating-linear-gradient(45deg, rgba(255,107,129,.05) 0 12px, transparent 12px 24px),
      linear-gradient(160deg,#1c1016,#0d0709);
    box-shadow:0 0 30px rgba(255,107,129,.18);
  }
  #debugZone::before, #debugZone::after{ display:none; }
  #debugZone h2{ color:var(--pink); border-bottom-color:rgba(255,107,129,.35); }
  #debugZone h2::before{ content:'☢️'; }
  #debugZone h3{ color:var(--pink); }
  .dbgWarn{ font-family:var(--mono); font-size:11px; color:#ffb3bf; line-height:1.8;
    background:rgba(255,107,129,.08); border:1px dashed rgba(255,107,129,.4);
    border-radius:8px; padding:10px 12px; margin-bottom:14px; }
  .dbgRow{ display:flex; align-items:center; gap:8px; padding:7px 0; flex-wrap:wrap;
    border-bottom:1px solid rgba(255,255,255,.05); }
  .dbgRow .dk{ font-family:var(--mono); font-size:11.5px; color:var(--muted); min-width:120px; }
  .dbgRow .dv{ font-family:var(--mono); font-size:12.5px; color:var(--gold); font-weight:800;
    min-width:74px; text-align:right; }
  .dbgRow input[type=number], .dbgRow input[type=text]{
    width:110px; background:#0d0f17; color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:5px 8px; font-family:var(--mono); font-size:12px; }
  .dbgRow select{ background:#0d0f17; color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:5px 8px; font-family:var(--mono); font-size:12px; }
  .dbgBtn{ padding:5px 11px; border:none; border-radius:6px; cursor:pointer;
    font-family:var(--mono); font-size:11.5px; font-weight:800;
    background:rgba(255,107,129,.16); color:#ffb3bf; border:1px solid rgba(255,107,129,.4); }
  .dbgBtn:hover{ background:rgba(255,107,129,.26); }
  .dbgBtn.mini{ padding:5px 9px; }
  .dbgBtn.danger{ background:rgba(255,60,90,.22); color:#fff; border-color:rgba(255,60,90,.7); }
  .dbgErr{
    font-family:var(--mono); font-size:12.5px; color:#fff; line-height:1.8;
    background:rgba(255,60,90,.18); border:1px solid rgba(255,60,90,.7);
    border-radius:9px; padding:13px 15px;
  }
  .dbgPickBtns{ display:flex; gap:8px; flex-wrap:wrap; }
  .dbgPickBtn{
    padding:8px 14px; min-height:44px; border-radius:9px; cursor:pointer;
    background:#12141d; border:1px solid var(--line-soft); color:var(--muted);
    font-family:var(--mono); font-size:13px; font-weight:700;
  }
  .dbgPickBtn.on{ background:rgba(255,107,129,.2); color:#fff; border-color:rgba(255,107,129,.75);
    box-shadow:0 0 14px rgba(255,107,129,.28); }
  .dbgGrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:8px; }
  .dbgPreview{ font-family:var(--mono); font-size:11px; color:var(--cyan); padding:6px 0 0; }
  .dbgPreview.warn{ color:#ffb3bf; }
  .achChips{ display:flex; flex-wrap:wrap; gap:6px; }
  .achChip{ font-family:var(--mono); font-size:11px; padding:4px 9px; border-radius:6px; cursor:pointer;
    background:#12141d; border:1px solid var(--line-soft); color:var(--muted); }
  .achChip.on{ background:rgba(233,196,106,.16); color:var(--gold); border-color:rgba(233,196,106,.45); }
  .ttList{ max-height:210px; overflow-y:auto; border:1px solid var(--line-soft); border-radius:8px; padding:8px; }
  #dbgToast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(8px);
    background:linear-gradient(180deg,#141620,#0c0e15); color:var(--gold);
    font-family:var(--mono); font-size:13px; font-weight:700; padding:11px 20px; border-radius:9px;
    border:1px solid rgba(233,196,106,.5); z-index:500; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; max-width:86vw; text-align:center; }
  #dbgToast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #dbgToast.bad{ color:var(--pink); border-color:rgba(255,107,129,.6); }

  @media (max-width:640px){
    main{ padding:12px 12px calc(20px + env(safe-area-inset-bottom)); }
    section{ padding:14px; }
    .kpi .v{ font-size:22px; }
  }
  /* 窄螢幕：避免任何橫向溢出（表格例外，它包在 .tblWrap 內刻意可橫捲） */
  @media (max-width:420px){
    main{ padding:10px 10px calc(18px + env(safe-area-inset-bottom)); }
    section{ padding:12px; border-radius:10px; }
    header{ padding:14px 12px 11px; }
    header .htxt{ font-size:14px; }
    .buffGrid{ grid-template-columns:1fr; }        /* 三欄 → 單欄 */
    .kpiGrid{ grid-template-columns:1fr; }
    .dbgGrid{ grid-template-columns:1fr; }
    .dbgRow{ gap:6px; }
    .dbgRow .dk{ min-width:0; flex:1 0 100%; }     /* 標籤獨立一行，欄位不被擠爆 */
    .dbgRow .dv{ min-width:0; }
    .dbgRow input[type=number], .dbgRow input[type=text]{ width:88px; }
    .dbgRow select{ max-width:100%; }
    .evCtl{ gap:6px; }
    .evBtn{ margin-left:0; width:100%; }
    .evCtl .dur{ width:100%; }
    .evCtl input[type=datetime-local]{ width:100%; }
    #debugZone{ padding:14px; }
    .tlItem .m{ font-size:12.5px; }
  }
</style>
</head>
<body>

<div id="lock">
  <div class="ic">📊</div>
  <h1>STATS</h1>
  <div class="hint">數據儀表板</div>
  <input type="password" id="pw" placeholder="輸入密碼">
  <button id="pwBtn">進入</button>
  <div id="pwMsg"></div>
</div>

<header>
  <span style="font-size:20px">📊</span>
  <span class="htxt">TASKBOARD STATS</span>
  <span class="htag">READ ONLY</span>
</header>

<main>
  <button class="dbgBtn" id="jumpDbg" style="width:100%;margin-bottom:14px;min-height:44px"
          onclick="jumpDebug()">☢️ 跳到數據編輯</button>
  <div class="notice" id="notice">載入中⋯</div>

  <!-- 🎛️ 系統控制台 -->
  <section>
    <h2>🎛️ 系統控制台<span style="margin-left:auto;font-size:10px;color:var(--dim)">只有這裡能改活動</span></h2>
    <h3>目前生效中的加成</h3>
    <div class="buffGrid" id="buffGrid"></div>
    <div id="killAllBox" style="display:none;margin-bottom:16px">
      <button class="evBtn stop" id="killAllBtn" style="width:100%">🛑 全部關閉</button>
    </div>
    <h3>活動</h3>
    <div id="evList"></div>
  </section>

  <!-- ① 系統總覽 -->
  <section>
    <h2>① 系統總覽</h2>
    <div class="kpiGrid" id="kpi"></div>
  </section>

  <!-- ② 每日收支 -->
  <section>
    <h2>② 每日收支
      <span class="spacer"></span>
      <span class="seg" id="segRange"></span>
      <span class="seg" id="segWho"></span>
    </h2>
    <div id="flowChart"></div>
    <div class="sub" id="flowSub"></div>
  </section>

  <!-- ③ 累計金幣走勢 -->
  <section>
    <h2>③ 累計金幣走勢</h2>
    <div id="cumChart"></div>
    <div class="sub" id="cumSub"></div>
  </section>

  <!-- ④ 每日任務達成率 -->
  <section>
    <h2>④ 每日任務達成率（30 天）</h2>
    <div id="dailyChart"></div>
  </section>

  <!-- ⑤ 消費排行 -->
  <section>
    <h2>⑤ 消費排行</h2>
    <div id="spend"></div>
  </section>

const isKnown = id => id != null && Object.prototype.hasOwnProperty.call(players, id);
function orphanCount(){
  let n = 0;
  ledger.forEach(l=>{ if(!isKnown(l.playerId)) n++; });
  purchases.forEach(p=>{ if(!isKnown(p.playerId)) n++; });
  penalties.forEach(p=>{ if(!isKnown(p.playerId)) n++; });

    const badC = t.claimedBy != null && !isKnown(t.claimedBy);
    if(badA || badC) n++;
  });
  return n;
}

/* ==================================================================
   SVG 圖表（手刻，無套件）
================================================================== */
function niceMax(v){
  if(v <= 0) return 10;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}
// series: [{name, color, values:[]}]，labels: x 軸字串
function lineChart(labels, series, opts={}){
  const W = opts.w || 780, H = opts.h || 240;
  const L = 52, R = 14, T = 14, B = 30;
  const iw = W - L - R, ih = H - T - B;
  const all = series.flatMap(s=>s.values);
  if(!labels.length || !all.length) return '<div class="empty">這段期間沒有資料</div>';
  const max = niceMax(Math.max(...all, 1));
  const x = i => L + (labels.length === 1 ? iw/2 : iw * i / (labels.length - 1));
  const y = v => T + ih - (v / max) * ih;

  let g = '';
  for(let i=0;i<=4;i++){
    const v = max * i / 4, yy = y(v);
    g += `<line class="grid" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"/>`
       + `<text class="axis" x="${L-7}" y="${yy+3}" text-anchor="end">${nf(v)}</text>`;
  }
  const step = Math.max(1, Math.ceil(labels.length / 8));
  let xa = '';
  labels.forEach((lb,i)=>{
    if(i % step === 0 || i === labels.length-1)
      xa += `<text class="axis" x="${x(i)}" y="${H-10}" text-anchor="middle">${esc(mmdd(lb))}</text>`;
  });
  let lines = '';
  series.forEach(s=>{
    const pts = s.values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    lines += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v,i)=>{
      lines += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" fill="${s.color}">
        <title>${esc(s.name)} ${esc(mmdd(labels[i]))}：${nf(v)}</title></circle>`;
    });
  });
  const legend = series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}${xa}${lines}</svg>
    <div class="legend">${legend}</div>`;
}
// 堆疊長條：rows = [{label, parts:[{v,color,name}]}]
function stackChart(rows, opts={}){
  const W = opts.w || 780, H = opts.h || 190;
  const L = 34, R = 12, T = 12, B = 26;
  const iw = W - L - R, ih = H - T - B;
  if(!rows.length) return '<div class="empty">這段期間沒有資料</div>';
  const max = niceMax(Math.max(...rows.map(r=>r.parts.reduce((a,b)=>a+b.v,0)), 1));
  const bw = Math.max(2, iw / rows.length - 2);
  let g = '';
  for(let i=0;i<=3;i++){
    const v = max*i/3, yy = T + ih - (v/max)*ih;
    g += `<line class="grid" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"/>`
       + `<text class="axis" x="${L-6}" y="${yy+3}" text-anchor="end">${nf(v)}</text>`;
  }
  let bars = '', xa = '';
  const step = Math.max(1, Math.ceil(rows.length / 10));
  rows.forEach((r,i)=>{
    const bx = L + iw * i / rows.length + 1;
    let acc = 0;
    r.parts.forEach(p=>{
      if(p.v <= 0) return;
      const h = (p.v / max) * ih;
      const by = T + ih - acc - h;
      bars += `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}"
        fill="${p.color}" rx="1"><title>${esc(mmdd(r.label))} ${esc(p.name)}：${p.v}</title></rect>`;
      acc += h;
    });
    if(i % step === 0 || i === rows.length-1)
      xa += `<text class="axis" x="${(bx+bw/2).toFixed(1)}" y="${H-9}" text-anchor="middle">${esc(mmdd(r.label))}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}${bars}${xa}</svg>`;
}
function hbar(label, valTxt, ratio, cls=''){
  return `<div class="hbar ${cls}">
    <div class="t"><span>${label}</span><b>${valTxt}</b></div>
    <div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,ratio*100)).toFixed(1)}%"></div></div>
  </div>`;
}

/* ==================================================================
   ② 每日收支
================================================================== */
let flowRange = 30, flowWho = 'all';
function renderFlowControls(){
  $('segRange').innerHTML = [7,30,90].map(n=>
    `<button data-n="${n}" class="${flowRange===n?'on':''}">${n} 天</button>`).join('');
  $('segWho').innerHTML = `<button data-w="all" class="${flowWho==='all'?'on':''}">全體</button>` +
    pids().map(id=>`<button data-w="${esc(id)}" class="${flowWho===id?'on':''}">${esc(pName(id))}</button>`).join('');
  $('segRange').querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ flowRange = +b.dataset.n; renderFlow(); renderFlowControls(); };
  });
  $('segWho').querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ flowWho = b.dataset.w; renderFlow(); renderFlowControls(); };
  });
}
function renderFlow(){
  const days = lastNDays(flowRange);
  const inc = {}, exp = {};
  days.forEach(d=>{ inc[d]=0; exp[d]=0; });
  ledger.forEach(l=>{
    const d = dayOf(l.createdAt);
    if(!d || !(d in inc)) return;
    if(!isKnown(l.playerId)) return;                        // 排除孤兒
    if(flowWho !== 'all' && l.playerId !== flowWho) return;
    const v = l.delta || 0;
    if(v > 0) inc[d] += v; else if(v < 0) exp[d] += -v;
  });
  const iv = days.map(d=>inc[d]), ev = days.map(d=>exp[d]);
  const has = iv.some(v=>v>0) || ev.some(v=>v>0);
  $('flowChart').innerHTML = has ? lineChart(days, [
    { name:'收入', color:'#e9c46a', values:iv },
    { name:'支出', color:'#ff6b81', values:ev },
  ]) : '<div class="empty">這段期間沒有資料</div>';
  const ai = iv.reduce((a,b)=>a+b,0)/days.length, ae = ev.reduce((a,b)=>a+b,0)/days.length;
  $('flowSub').innerHTML = has
    ? `期間平均：日收入 <b style="color:var(--gold)">${nf(ai)}</b>　日支出 <b style="color:var(--pink)">${nf(ae)}</b>　
       淨額 ${nf(ai-ae)}／天`
    : '（資料來自 ledger，只涵蓋記帳上線後的期間）';
}

/* ==================================================================
   ③ 累計金幣走勢
================================================================== */
function renderCum(){
  const start = ledgerStart();
  if(!start){
    $('cumChart').innerHTML = '<div class="empty">尚無 ledger 資料，無法重建走勢</div>';
    $('cumSub').textContent = '';
    return;
  }
  const base = new Date(start).getTime(), end = new Date(todayKey()).getTime();
  const days = [];
  for(let t=base; t<=end; t+=86400000) days.push(new Date(t).toISOString().slice(0,10));
  const colors = ['#e9c46a','#5ff0dc','#c9a0ff','#ff6b81','#5aa9ff'];
  const series = pids().map((id,i)=>{
    const per = {}; days.forEach(d=>per[d]=0);
    ledger.forEach(l=>{
      if(l.playerId !== id) return;
      const d = dayOf(l.createdAt);
      if(d && d in per) per[d] += (l.delta || 0);
    });
    let acc = 0;
    return { name: pName(id), color: colors[i % colors.length],
             values: days.map(d=> acc += per[d]) };
  });
  $('cumChart').innerHTML = series.length ? lineChart(days, series) : '<div class="empty">沒有玩家資料</div>';
  $('cumSub').innerHTML = `起點為 ledger 第一筆的日期 <b style="color:var(--gold)">${start}</b>，
    更早的變動無法重建，因此這條線是<b>相對值</b>（不是實際持有金幣）。`;
}

/* ==================================================================
   ④ 每日任務達成率
================================================================== */
function renderDaily(){
  const days = lastNDays(30);
  const out = pids().map(id=>{
    const rows = days.map(d=>{
      const t = tasks.filter(x=>x.isDaily && x.assignee===id && x.dateKey===d);
      return { label:d, parts:[
        { name:'已完成', v:t.filter(x=>x.status==='done').length,    color:'#e9c46a' },
        { name:'待審核', v:t.filter(x=>x.status==='pending').length, color:'#5ff0dc' },
        { name:'過期',   v:t.filter(x=>x.status==='expired').length, color:'#ff6b81' },
      ]};
    });
    const done = rows.reduce((a,r)=>a+r.parts[0].v,0);
    const total = rows.reduce((a,r)=>a+r.parts.reduce((x,p)=>x+p.v,0),0);
    // 最長連續達成天數
    let best = 0, cur = 0;
    days.forEach(d=>{
      const ok = tasks.some(x=>x.isDaily && x.assignee===id && x.dateKey===d && x.status==='done');
      cur = ok ? cur+1 : 0; if(cur > best) best = cur;
    });
    return `<div class="pcard">
      <div class="pn">${esc(pName(id))}</div>
      ${total ? stackChart(rows) : '<div class="empty">這段期間沒有資料</div>'}
      <div class="legend">
        <span><i style="background:#e9c46a"></i>已完成</span>
        <span><i style="background:#5ff0dc"></i>待審核</span>
        <span><i style="background:#ff6b81"></i>過期</span>
      </div>
      <div class="sub">達成率 <b style="color:var(--gold)">${total?Math.round(done/total*100):0}%</b>
        （${done} / ${total}）　最長連續達成 <b style="color:var(--gold)">${best}</b> 天</div>
    </div>`;
  }).join('');
  $('dailyChart').innerHTML = out || '<div class="empty">沒有玩家資料</div>';
}

function renderSpend(){
  // 商品銷售（purchases，全歷史；排除抽獎券）
  const g = {};
  purchases.filter(p=>isKnown(p.playerId) && !p.isTicket && p.status!=='refunded').forEach(p=>{
    const k = p.itemName || '（未命名）';

  // 抽獎券單獨列出（最大回收管道）
  const tks = purchases.filter(p=>isKnown(p.playerId) && p.isTicket && p.status!=='refunded');
  const tkSum = tks.reduce((a,b)=>a+(b.price||0),0);

  // 稱號購買（只有 ledger 有）
  const tls = ledger.filter(l=>isKnown(l.playerId) && l.kind==='title');
  const tlSum = tls.reduce((a,b)=>a-(b.delta||0),0);

  $('spend').innerHTML = `
    <h3>商品銷售排行（全歷史，不含抽獎券）</h3>
    ${rows.length ? rows.map(([name,v])=>
      hbar(esc(name)+` <span class="pill gold">${v.n} 次</span>`, '🪙 '+nf(v.sum), v.sum/maxSum)
    ).join('') : '<div class="empty">還沒有商品購買紀錄</div>'}

    <h3>抽獎券（金幣最大回收管道）</h3>
    <div class="kpiGrid">
      <div class="kpi"><div class="k">購買次數</div><div class="v">${nf(tks.length)}</div>
        <div class="d">全歷史 purchases 中 isTicket 的筆數</div></div>
      <div class="kpi pink"><div class="k">總花費</div><div class="v">${nf(tkSum)}</div>
        <div class="d">每張 500，這是回收金幣的主力</div></div>
    </div>

    <h3>稱號購買（僅 ledger 期間）</h3>
    ${tls.length ? tls.map(l=>`
      <div class="hbar cyan">
        <div class="t"><span>${esc(l.label)} <span class="pill cyan">${esc(l.meta?.tier||'')} 級</span>
          <span style="color:var(--dim)">${esc(dayOf(l.createdAt)||'')}</span></span>
          <b>🪙 ${nf(-(l.delta||0))}</b></div>
      </div>`).join('') +

/* ==================================================================
   ⑥ 抽獎分析
================================================================== */
function renderLottery(){
  // 每位玩家概況
  const per = pids().map(id=>{
    const p = players[id];
    const mats = p.materials || {};
    const crafted = p.craftedTitles || {};
    const cList = CRAFT_TITLES.filter(t=>(crafted[t.id]||0)>0)
      .map(t=>`${t.icon} ${t.name}${(crafted[t.id]>1)?' ×'+crafted[t.id]:''}`).join('、') || '無';
    return `<div class="pcard">
      <div class="pn">${esc(pName(id))}
        <span class="pill gold">🍀 ×${luckOf(p)}</span></div>
      <div class="sub" style="margin-top:0">
        抽獎次數 <b style="color:var(--gold)">${nf(p.lotteryCount ?? 0)}</b>　·　
        保底 pity <b style="color:var(--purple)">${p.lotteryPity ?? 0}/${PITY_MAX}</b>　·　
        已合成：${esc(cList)}
      </div>
      <div style="margin-top:10px">
        ${MATERIALS.map(m=>{
          const h = mats[m.key] ?? 0;
          return hbar(`${m.icon} ${m.name}`, `${h}/${m.need}`, Math.min(1, h/m.need), h>=m.need?'':'cyan');
        }).join('')}
      </div>
    </div>`;
  }).join('');

  // 獎品分布：實際 vs 理論（只有 ledger 有）
  const draws = ledger.filter(l=>isKnown(l.playerId) && (l.kind==='lottery_coin' || l.kind==='lottery_mat'));
  let dist = '<div class="empty">記帳期間內沒有抽獎紀錄（ledger 上線前的抽獎無法重建）</div>';
  if(draws.length){
    const theo = {};
    PRIZES.forEach(p=>{ if(p.name==='AGAIN') return; theo[p.name] = (theo[p.name]||0) + p.prob; });
    // AGAIN 不寫 ledger → 理論值以「非 AGAIN 的 93%」為分母重新標準化
    const base = Object.values(theo).reduce((a,b)=>a+b,0);
    const act = {};
    draws.forEach(l=>{ act[l.label] = (act[l.label]||0)+1; });
    const names = Object.keys(theo);
    const maxPct = Math.max(...names.map(n=>Math.max((act[n]||0)/draws.length*100, theo[n]/base*100)), 1);
    dist = names.map(n=>{
      const a = (act[n]||0)/draws.length*100, t = theo[n]/base*100;
      const icon = PRIZES.find(p=>p.name===n)?.icon || '';
      return `<div class="hbar">
        <div class="t"><span>${icon} ${esc(n)}</span>
          <b>實際 ${a.toFixed(2)}%　<span style="color:var(--muted)">理論 ${t.toFixed(2)}%</span></b></div>
        <div class="track"><div class="fill" style="width:${(a/maxPct*100).toFixed(1)}%"></div></div>
        <div class="track" style="margin-top:3px;opacity:.55">
          <div class="fill" style="width:${(t/maxPct*100).toFixed(1)}%;background:linear-gradient(90deg,#3a4668,#7f93c9)"></div></div>
      </div>`;
    }).join('') + `<div class="sub">樣本 <b style="color:var(--gold)">${draws.length}</b> 抽。
      上排金色＝實際、下排灰藍＝理論（已排除不寫帳的 AGAIN 並重新標準化）。
      樣本數少時偏差大是正常的，持續偏離才代表機率寫錯。</div>`;
  }

  // 花費 vs 抽回
  const spent = ledger.filter(l=>isKnown(l.playerId) && l.kind==='ticket').reduce((a,b)=>a-(b.delta||0),0);
  const back  = ledger.filter(l=>isKnown(l.playerId) && l.kind==='lottery_coin').reduce((a,b)=>a+(b.delta||0),0);
  const rate  = spent ? (back/spent*100) : 0;

  $('lottery').innerHTML = `
    ${per || '<div class="empty">沒有玩家資料</div>'}
    <h3>獎品分布：實際 vs 理論機率</h3>
    ${dist}
    <h3>投入產出（僅 ledger 期間）</h3>
    <div class="kpiGrid">
      <div class="kpi pink"><div class="k">抽獎券總花費</div><div class="v">${nf(spent)}</div>
        <div class="d">ledger 中 kind=ticket 的總額</div></div>
      <div class="kpi"><div class="k">抽回金幣</div><div class="v">${nf(back)}</div>
        <div class="d">中到的 200／1000 金幣總和（不含材料價值）</div></div>
      <div class="kpi cyan"><div class="k">實際回收率</div><div class="v">${rate.toFixed(1)}%</div>
        <div class="d">抽回 ÷ 花費。低於 100% 代表抽獎正在回收金幣（設計如此）</div></div>
    </div>`;
}

function renderDiscipline(){
  const sorted = penalties.filter(p=>isKnown(p.playerId)).sort((a,b)=>{
    const x = dayOf(a.createdAt) || '', y = dayOf(b.createdAt) || '';
    return y.localeCompare(x);
  });
  const tl = sorted.length ? `<div class="tl">${sorted.slice(0,40).map(p=>{
    const d = p.createdAt?.toDate ? p.createdAt.toDate() : null;
    const ds = d ? `${tzKey(d)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` : '—';
    const st = { active:'進行中', reported:'待確認', cleared:'已解除' }[p.status] || p.status;
    return `<div class="tlItem ${p.type==='lock'?'lock':''}">
      <div class="d">${esc(ds)}</div>
      <div class="m">${esc(pName(p.playerId))}
        <span class="pill ${p.type==='fine'?'gold':'pink'}">${p.type==='fine'?'罰款':'禁閉'}</span></div>
      <div class="s">${esc(p.reason||'—')}　${p.type==='fine'
        ? `<b style="color:var(--pink)">−🪙 ${nf(p.amount||0)}</b>`
        : `贖罪：${esc(p.taskTitle||'—')}・${esc(st)}`}</div>
    </div>`;
  }).join('')}</div>` : '<div class="empty">目前沒有任何罰單，家裡很和平 👍</div>';

  // 連續無罰單天數
  const clean = pids().map(id=>{
    const mine = penalties.filter(p=>p.playerId===id).map(p=>dayOf(p.createdAt)).filter(Boolean).sort();
    let startKey = mine.length ? mine[mine.length-1] : dayOf(players[id].createdAt);
    if(!startKey) return `<div class="sub">${esc(pName(id))}：資料不足</div>`;
    const n = Math.round((new Date(todayKey()) - new Date(startKey))/86400000) + 1;
    return hbar(esc(pName(id)) + (mine.length?`<span class="pill gold">最後一張 ${mine[mine.length-1]}</span>`
      :'<span class="pill cyan">從未被罰</span>'), n + ' 天', Math.min(1, n/30));
  }).join('');

  // 禁閉平均解除時長
  const locks = penalties.filter(p=>p.type==='lock' && p.status==='cleared'
    && p.createdAt?.toDate && p.clearedAt?.toDate);
  let avgTxt = '<div class="empty">還沒有已解除的禁閉紀錄</div>';
  if(locks.length){
    const hrs = locks.map(p=>(p.clearedAt.toDate() - p.createdAt.toDate())/3600000);
    const avg = hrs.reduce((a,b)=>a+b,0)/hrs.length;
    avgTxt = `<div class="kpiGrid">
      <div class="kpi"><div class="k">禁閉平均解除時長</div>
        <div class="v">${avg < 24 ? avg.toFixed(1)+' 小時' : (avg/24).toFixed(1)+' 天'}</div>
        <div class="d">開單 → 解除的平均時間，共 ${locks.length} 筆</div></div>
      <div class="kpi cyan"><div class="k">最快 / 最慢</div>
        <div class="v" style="font-size:18px">${Math.min(...hrs).toFixed(1)}h / ${Math.max(...hrs).toFixed(1)}h</div>
        <div class="d">拖越久，每日任務過期與 streak 中斷的損失越大</div></div>
    </div>`;
  }

  $('discipline').innerHTML = `
    <h3>連續無罰單天數（滿 30 天解鎖「清白之身」）</h3>
    ${clean || '<div class="empty">沒有玩家資料</div>'}
    <h3>禁閉處理效率</h3>
    ${avgTxt}
    <h3>罰單時間軸（最近 40 筆）</h3>
    ${tl}`;
}

/* ==================================================================
   🎛️ 活動控制台
   ⚠️ v1.3 起權限規則：本檔為 Chen 專用除錯後台。
   允許的寫入只有兩處：(1) 這裡的 config/system，(2) 最下方 DEBUG ZONE 的 players + ledger。
   統計圖表區域一律不得有任何寫入；且全檔不提供任何刪除／批次刪除功能。
================================================================== */
let durChoice = {};          // { key: '1'|'3'|'7'|'custom' }
let durCustom = {};          // { key: datetime-local 字串 }

async function saveSystemConfig(patch){
  // 這是本檔案唯一的 setDoc 呼叫點，目標固定為 config/system
  return setDoc(doc(db,'config','system'), patch, { merge:true });
}

// 倒數：進行中・剩 2 天 5 小時
function leftText(until){
  if(!until) return '無期限';
  const ms = new Date(until).getTime() - Date.now();
  if(isNaN(ms) || ms <= 0) return '';
  const d = Math.floor(ms/86400000), h = Math.floor(ms/3600000)%24, m = Math.floor(ms/60000)%60;
  if(d > 0) return `剩 ${d} 天 ${h} 小時`;
  if(h > 0) return `剩 ${h} 小時 ${m} 分`;
  return `剩 ${m} 分`;
}
// datetime-local → 含 +08:00 的 ISO 字串
function toTaipeiIso(local){
  return local ? local.replace('T',' ').replace(' ','T') + ':00+08:00' : null;
}
function daysLaterIso(n){
  const d = new Date(Date.now() + n*86400000);
  const p = x => String(x).padStart(2,'0');
  // 以台灣時間表示
  const t = new Date(d.toLocaleString('en-US',{ timeZone:'Asia/Taipei' }));
  return `${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())}T${p(t.getHours())}:${p(t.getMinutes())}:00+08:00`;
}

window.setDur = (key, v)=>{ durChoice[key] = v; renderConsole(); };
window.setCustom = (key, v)=>{ durCustom[key] = v; };

window.toggleEvent = async (key)=>{
  const e = EVENTS.find(x=>x.key===key);
  const live = eventOn(key);
  if(live){
    if(!confirm(`要關閉「${e.name}」嗎？\n關閉後加成立即失效。`)) return;
    try { await saveSystemConfig({ events: { [key]: { on:false, until:null } } }); }
    catch(err){ alert('關閉失敗：' + err.message); }
    return;
  }
  const c = durChoice[key] || '1';
  let until;
  if(c === 'custom'){
    if(!durCustom[key]){ alert('請先選結束時間'); return; }
    until = toTaipeiIso(durCustom[key]);
  } else {
    until = daysLaterIso(Number(c));
  }
  const d = new Date(until);
  if(isNaN(d)){ alert('時間格式不正確'); return; }
  if(d.getTime() <= Date.now()){ alert('結束時間必須在未來'); return; }
  if(!confirm(`要開啟「${e.name}」嗎？\n效果：${e.ef}\n結束時間：${d.toLocaleString('zh-TW',{ timeZone:'Asia/Taipei' })}`)) return;
  try { await saveSystemConfig({ events: { [key]: { on:true, until } } }); }
  catch(err){ alert('開啟失敗：' + err.message); }
};

window.killAllEvents = async ()=>{
  const live = activeEvents();
  if(!live.length) return;
  const lines = live.map(e=>{
    const l = leftText(eventUntil(e.key));
    return `・${e.icon} ${e.name}${l ? `（${l}）` : ''}`;
  }).join('\n');
  if(!confirm(`要關閉全部進行中的活動嗎？\n\n${lines}\n\n關閉後立即生效，玩家的加成會馬上消失。`)) return;
  const patch = {};
  EVENTS.forEach(e=>{ patch[e.key] = { on:false, until:null }; });
  try {
    await saveSystemConfig({ events: patch });     // 一次寫入全關
    alert(`已關閉 ${live.length} 個活動`);
  } catch(err){ alert('關閉失敗：' + err.message); }
};

function renderConsole(){
  // 生效中的加成總覽
  const buffs = [
    { k:'金幣加成', v:eventAdd('coin') },
    { k:'XP 加成',  v:eventAdd('xp') },
    { k:'幸運加成', v:eventAdd('luck') },
  ];
  $('buffGrid').innerHTML = buffs.map(b=>`
    <div class="buffCell ${b.v>0?'on':''}">
      <div class="bk">${b.k}</div>
      <div class="bv">+${Math.round(b.v*100)}%</div>
    </div>`).join('');

  // 至少一個活動進行中才顯示「全部關閉」
  const live = activeEvents();
  $('killAllBox').style.display = live.length ? '' : 'none';

  $('evList').innerHTML = EVENTS.map(e=>{
    const live = eventOn(e.key), exp = eventExpired(e.key);
    const until = eventUntil(e.key);
    const st = live ? `<span class="evSt live">進行中・${leftText(until)}</span>`
             : exp  ? `<span class="evSt exp">已結束（記得關閉）</span>`
             :        `<span class="evSt off">未啟用</span>`;
    const cur = durChoice[e.key] || '1';
    // 進行中或已結束 → 隱藏期間選擇（要改期限得先關閉）
    const picker = (live || exp) ? '' : `
      <div class="dur">
        ${['1','3','7'].map(n=>`<button class="${cur===n?'on':''}" onclick="setDur('${e.key}','${n}')">${n} 天</button>`).join('')}
        <button class="${cur==='custom'?'on':''}" onclick="setDur('${e.key}','custom')">自訂</button>
        ${cur==='custom' ? `<input type="datetime-local" value="${esc(durCustom[e.key]||'')}"
           onchange="setCustom('${e.key}', this.value)">` : ''}
      </div>`;
    return `<div class="evRow ${live?'live':''} ${exp?'expired':''}">
      <div class="evTop">
        <span class="ei">${e.icon}</span>
        <span class="en">${esc(e.name)}</span>
        <span class="ef">${esc(e.ef)}</span>
        ${st}
      </div>
      <div class="evCtl">
        ${picker}
        <button class="evBtn ${(live||exp)?'stop':'go'}" onclick="toggleEvent('${e.key}')">
          ${(live||exp) ? '關閉活動' : '開啟活動'}
        </button>
      </div>
    </div>`;
  }).join('');
}
// 倒數每 30 秒更新

/* ==================================================================
   ☢️ DEBUG ZONE
   本區是全檔唯一允許寫 players 的地方；上方統計圖表區一律唯讀。
   規範：每個寫入都 confirm、都記 ledger(kind:'debug')、不提供任何刪除功能。
================================================================== */
let dbgId = null;

function dbgToast(msg, bad){
  const t = $('dbgToast');
  t.textContent = msg;
  t.className = bad ? 'show bad' : 'show';
  clearTimeout(t._tm);
  t._tm = setTimeout(()=> t.className = '', 2600);
}

// 唯一的 players 寫入通道：寫入 + 記帳
async function dbgWrite(patch, label, meta, coinDelta){
  if(!dbgId) return;
  try {
    await updateDoc(doc(db,'players',dbgId), patch);
    await addDoc(collection(db,'ledger'), {
      playerId: dbgId, delta: coinDelta || 0, kind:'debug',
      label, meta: meta || {}, createdAt: serverTimestamp(),
    });
    dbgToast('✅ ' + label);
  } catch(e){
    dbgToast('✗ 寫入失敗：' + e.message, true);
  }
}
const dbgP = () => (dbgId && players[dbgId]) ? players[dbgId] : null;
const dbgVal = id => { const el = $(id); return el ? el.value : ''; };
const dbgNum = id => { const v = Number(dbgVal(id)); return isNaN(v) ? 0 : v; };
const getPath = (o, path) => path.split('.').reduce((a,k)=> (a==null?a:a[k]), o);

// 用按鈕而不是 <select>：高頻重繪的頁面上，原生 select 的使用者選擇永遠會輸給程式覆寫
function renderDbgPicker(){
  const box = $('dbgPickBtns');

    <button class="dbgPickBtn ${id === dbgId ? 'on' : ''}"
            onclick="dbgPickPlayer('${esc(id)}')">${esc(players[id].name || id)}</button>`).join('');
}
window.dbgPickPlayer = (id)=>{
  dbgId = id || null;
  renderDebug();
  const z = $('debugZone');

};
window.jumpDebug = ()=> $('debugZone').scrollIntoView({ behavior:'smooth', block:'start' });
window.toggleDbgOverview = ()=>{

/* ---- 一般數值：設為 / 加減 ---- */
window.dbgSet = async (path, inputId, label)=>{
  const p = dbgP(); if(!p) return;
  const from = getPath(p, path) ?? 0;
  const to = dbgNum(inputId);
  if(from === to){ dbgToast('值沒有變'); return; }
  if(!confirm(`確定把「${p.name}」的 ${label} 從 ${from} 改成 ${to} 嗎？`)) return;
  const coinDelta = (path === 'coins') ? (to - from) : 0;
  await dbgWrite({ [path]: to }, `設定 ${label}`, { field:path, from, to }, coinDelta);
};
window.dbgAdd = async (path, n, label)=>{
  const p = dbgP(); if(!p) return;
  const from = getPath(p, path) ?? 0;
  const to = from + n;

    + `天賦點 ${tkNow} → ${tkNext}　全解加成 +${Math.round(bonusNow*100)}% → +${Math.round(bonusNext*100)}%`)) return;

/* ---- 卡片 ---- */
window.dbgSetCard = async (cardId)=>{
  const p = dbgP(); if(!p) return;
  const c = cardById(cardId);
  const tier = dbgVal('dbg_cardT_'+cardId);
  const count = Math.max(0, dbgNum('dbg_cardC_'+cardId));
  const cur = { ...((p.cards) || {}) };
  const before = cur[cardId] ? `${cur[cardId].tier} ×${cur[cardId].count}` : '未擁有';
  const after  = count === 0 ? '未擁有（移除）' : `${tier} ×${count}`;
  if(!confirm(`確定把「${p.name}」的卡片「${c.name}」從 ${before} 改成 ${after} 嗎？`)) return;
  const patch = {};
  if(count === 0){
    delete cur[cardId];
    patch.cards = cur;
    // count 設 0 視為刪除，同時要從 equipped 移除
    const eq = ((p.equipped) || []).filter(x=>x!==cardId);
    if(eq.length !== ((p.equipped)||[]).length) patch.equipped = eq;
  } else {
    cur[cardId] = { tier, count };
    patch.cards = cur;
  }
  await dbgWrite(patch, `設定卡片 ${c.name} ${after}`, { field:'cards.'+cardId, from:before, to:after });
};

};

}

        onclick="dbgToggleShopTitle('${t.id}')" style="margin:3px">${t.tier}・${esc(t.name)}</span>`;
    }).join('')}</div>

    <h3>卡片</h3>
    <div class="dbgRow" style="background:rgba(233,196,106,.06);border-radius:8px;padding:9px 10px">
      <span class="dk">🎁 一鍵給卡</span>
      <select id="dbg_giveCard">${CARDS.map(c=>
        `<option value="${c.id}">${c.rar}・${esc(c.name)}</option>`).join('')}</select>
      <select id="dbg_giveTier">${PACK_TIERS.map(t=>
        `<option value="${t.id}">${t.name} ×${t.mult}</option>`).join('')}</select>
      <input type="number" id="dbg_giveCount" min="1" value="1" style="width:64px">
      <button class="dbgBtn" onclick="dbgGrantCard()">給予</button>
    </div>
    <div class="dbgRow">
      <span class="dk">裝備中（最多 2）</span>
      <select id="dbg_eq0">${['',...CARDS.map(c=>c.id)].map(id=>
        `<option value="${id}" ${((p.equipped)||[])[0]===id?'selected':''}>${id?esc(cardById(id).name):'（空）'}</option>`).join('')}</select>
      <select id="dbg_eq1">${['',...CARDS.map(c=>c.id)].map(id=>
        `<option value="${id}" ${((p.equipped)||[])[1]===id?'selected':''}>${id?esc(cardById(id).name):'（空）'}</option>`).join('')}</select>
      <button class="dbgBtn" onclick="dbgSetEquipped()">設定</button>
    </div>
    ${CARDS.map(c=>{
      const own = ((p.cards)||{})[c.id];
      return `<div class="dbgRow">
        <span class="dk">${esc(c.name)} <span style="color:var(--dim)">${c.rar}</span></span>
        <span class="dv">${own ? `${own.tier} ×${own.count}` : '—'}</span>
        <select id="dbg_cardT_${c.id}">${PACK_TIERS.map(t=>
          `<option value="${t.id}" ${(own?.tier||'normal')===t.id?'selected':''}>${t.name}</option>`).join('')}</select>
        <input type="number" id="dbg_cardC_${c.id}" min="0" value="${own?.count ?? 0}" style="width:70px">
        <button class="dbgBtn" onclick="dbgSetCard('${c.id}')">設為</button>
      </div>`;
    }).join('')}
    ${dbgNumRow('全通關已領 bossClearReward','bossClearReward', p.bossClearReward ?? 0, 'dbg_bcr', 1)}
    ${dbgNumRow('卡包券 packTickets','packTickets', p.packTickets ?? 0, 'dbg_pt', 1)}
    ${dbgNumRow('卡包保底 packPity','packPity', p.packPity ?? 0, 'dbg_pp', 1)}
    <div class="dbgRow">
      <span class="dk">換卡鎖</span>
      <span class="dv">${eqLeft > 0 ? Math.ceil(eqLeft/60000)+' 分' : '無'}</span>
      <button class="dbgBtn" onclick="dbgQuick('eqlock')">立即解鎖</button>
    </div>
    <div class="dbgRow">
      <span class="dk">技能 CD</span>
      <span class="dv">${cds.length} 個</span>
      <span style="font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:1">
        ${cds.map(([k,t])=>`${esc(k)} ${Math.ceil((t-Date.now())/60000)}分`).join('、') || '無'}</span>
      <button class="dbgBtn" onclick="dbgQuick('cd')">全部清除</button>
    </div>

    <h3>Boss</h3>
    <div class="dbgRow">
      <span class="dk">關卡 stage</span>
      <span class="dv">${boss.stage ?? 1}</span>
      <input type="number" id="dbg_stage" min="1" max="${BOSSES.length}" value="${boss.stage ?? 1}">
      <button class="dbgBtn" onclick="dbgSetStage()">切換（重設滿血）</button>
    </div>
    <div class="dbgRow">
      <span class="dk">HP（不換關）</span>
      <span class="dv">${(boss.hp ?? 0).toLocaleString()}</span>
      <input type="number" id="dbg_bossHp" min="0" value="${boss.hp ?? 0}">
      <button class="dbgBtn" onclick="dbgSetBossHp()">設為</button>
    </div>
    <div class="dbgRow">
      <span class="dk">DOT / 里程碑</span>
      <span class="dv">${((boss.dots)||[]).length} 層</span>
      <span style="font-family:var(--mono);font-size:11px;color:var(--muted);flex:1">
        已領里程碑：${((boss.milestones)||[]).join('%、') || '無'}</span>
      <button class="dbgBtn" onclick="dbgQuick('dots')">清空 DOT</button>
      <button class="dbgBtn" onclick="dbgResetMs()">重設里程碑</button>
    </div>

    <h3>其他</h3>
    <div class="dbgRow">
      <span class="dk">新手教學</span>
      <span class="dv">${p.tutorialDone === true ? '已完成' : '未完成'}</span>
      <button class="dbgBtn" onclick="dbgToggleTut()">切換</button>
    </div>
    <div class="dbgRow">
      <span class="dk">今日卡包</span>
      <span class="dv">${(p.dailyPacks?.date) || '無'}</span>
      <button class="dbgBtn" onclick="dbgQuick('packs')">重置今日卡包</button>
    </div>

    <h3>一鍵操作</h3>
    <div class="dbgGrid">${Object.entries(QUICK).map(([k,q])=>
      `<button class="dbgBtn" onclick="dbgQuick('${k}')">${q.t}</button>`).join('')}</div>

    <h3 style="color:#ff3c5a">危險操作（需輸入玩家名稱）</h3>
    <div class="dbgGrid">${Object.entries(DANGER).map(([k,d])=>
      `<button class="dbgBtn danger" onclick="dbgDanger('${k}')">${d.t}</button>`).join('')}</div>`;

  dbgXpPreview();
}

window.dbgFilterTitles = ()=>{
  const q = (dbgVal('dbg_ttSearch') || '').trim();
  $('dbg_ttList').querySelectorAll('.achChip').forEach(el=>{
    el.style.display = (!q || el.dataset.nm.includes(q)) ? '' : 'none';
  });
};
window.dbgResetMs = async ()=>{
  const p = dbgP(); if(!p) return;
  if(!confirm(`確定重設「${p.name}」目前關卡的里程碑嗎？（可以重新領一次）`)) return;
  await dbgWrite({ 'boss.milestones': [] }, '重設里程碑', { field:'boss.milestones' });
};
window.dbgToggleTut = async ()=>{
  const p = dbgP(); if(!p) return;
  const to = !(p.tutorialDone === true);
  if(!confirm(`確定把「${p.name}」的新手教學狀態改成「${to?'已完成':'未完成'}」嗎？`)) return;
  await dbgWrite({ tutorialDone: to }, `設定教學狀態 ${to?'已完成':'未完成'}`,
    { field:'tutorialDone', from:p.tutorialDone===true, to });
};

/* ===== 總繪製 ===== */
let raf = null;
function renderAll(){
  if(!ready.players) return;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(()=>{
    try {
      renderNotice(); renderKpi();
      renderFlowControls(); renderFlow();
      renderCum(); renderDaily(); renderSpend();
      renderLottery(); renderDiscipline(); renderCompare();
    } catch(e){
      console.error('stats render failed:', e);
      $('notice').innerHTML = '⚠️ 繪製時發生錯誤：' + esc(e.message);
    }
    // 編輯區獨立 try：錯誤要當場看得到，不能被上面的 catch 吞掉變成「按了沒反應」
    try { renderDebug(); }
    catch(e){
      console.error('renderDebug failed:', e);
      $('dbgBody').innerHTML = `<div class="dbgErr">編輯區載入失敗：${esc(e.message)}<br>
        <span style="opacity:.7">詳細堆疊請看 Console</span></div>`;
    }
  });
}
</script>
</body>
</html>
