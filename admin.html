<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>任務板・管理後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07080d;
    --panel-1:#10121c;
    --panel-2:#0b0d14;
    --line:rgba(233,196,106,.16);
    --line-soft:rgba(233,196,106,.10);
    --gold:#e9c46a;
    --gold-hi:#f7e3a1;
    --gold-deep:#c9a227;
    --gold-dim:#8a7a4a;
    --cyan:#5ff0dc;
    --cyan-deep:#173a37;
    --pink:#ff6b81;
    --text:#e8eaf2;
    --muted:#757b90;
    --dim:#454a5e;
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overscroll-behavior-y:none; }
  body {
    font-family:'Noto Sans TC', sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100dvh;
    min-height:-webkit-fill-available;
    overflow:hidden;
    position:relative;
    display:flex; flex-direction:column;
  }
  body::after{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(120% 55% at 50% -8%, rgba(233,196,106,.10), transparent 55%),
      linear-gradient(rgba(233,196,106,.030) 1px, transparent 1px) 0 0/100% 36px,
      linear-gradient(90deg, rgba(233,196,106,.030) 1px, transparent 1px) 0 0/36px 100%;
  }
  body::before{
    content:''; position:fixed; inset:0; z-index:9999; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.16) 2px 4px);
    opacity:.5; animation:flick 7s steps(40) infinite;
  }
  @keyframes flick{ 0%,97%,100%{opacity:.5;} 98%{opacity:.4;} 99%{opacity:.58;} }

  main, header, nav { position:relative; z-index:1; }

  /* ===== 密碼遮罩 ===== */
  #lockOverlay {
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px;
  }
  #lockOverlay .lockIcon{ font-size:46px; filter:drop-shadow(0 4px 18px rgba(233,196,106,.35)); }
  #lockOverlay h1 { font-family:var(--mono); font-size:22px; font-weight:800; letter-spacing:5px; color:var(--gold); }
  #lockOverlay .hint{ font-family:var(--mono); color:var(--muted); font-size:12px; letter-spacing:2px; margin-top:-8px; }
  #pwInput {
    font-family:var(--mono); font-size:18px; letter-spacing:3px; padding:13px 16px; border-radius:10px;
    border:1px solid var(--line); width:min(280px,82vw); text-align:center; background:#0c0e15; color:var(--text);
    transition:border-color .2s, box-shadow .2s;
  }
  #pwInput:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(233,196,106,.12), 0 0 20px rgba(233,196,106,.1); }
  #pwBtn {
    width:min(280px,82vw); padding:13px; border:none; border-radius:10px;
    background:linear-gradient(180deg,var(--gold-hi),var(--gold-deep)); color:#1a1206; font-size:16px; font-weight:800;
    font-family:var(--mono); letter-spacing:3px; cursor:pointer;
    box-shadow:0 0 0 1px rgba(233,196,106,.4), 0 8px 24px rgba(233,196,106,.18); transition:transform .12s;
  }
  #pwBtn:active{ transform:translateY(2px) scale(.98); }

  /* ===== header ===== */
  header {
    padding:14px 16px 12px; position:relative; flex-shrink:0;
    background:linear-gradient(180deg, #0a0b12 40%, rgba(7,8,13,.82));
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px;
  }
  header::after{
    content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(233,196,106,.5), transparent);
  }
  header .dot{ font-size:20px; }
  header .htxt{ font-family:var(--mono); font-size:15px; font-weight:800; letter-spacing:1.5px; color:var(--gold); }
  header .htag{ font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--gold-dim); margin-left:auto; border:1px solid var(--line); padding:2px 8px; border-radius:5px; }

  main {
    flex:1; min-height:0; width:100%; max-width:640px; margin:0 auto;
    overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain;
    padding:16px 16px 24px;
  }
  .page{ display:none; animation:pagein .3s ease; }
  .page.on{ display:block; }
  @keyframes pagein{ from{ opacity:0; transform:translateY(8px);} }

  section {
    position:relative;
    background:linear-gradient(160deg,var(--panel-1),var(--panel-2));
    border-radius:12px; padding:18px; margin-bottom:16px; border:1px solid var(--line);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 6px 20px rgba(0,0,0,.45);
  }
  section::before, section::after{
    content:''; position:absolute; width:12px; height:12px; pointer-events:none;
    border:1.5px solid rgba(233,196,106,.5);
  }
  section::before{ top:-1px; left:-1px; border-right:0; border-bottom:0; border-top-left-radius:12px; }
  section::after{ bottom:-1px; right:-1px; border-left:0; border-top:0; border-bottom-right-radius:12px; }
  section h2 {
    font-family:var(--mono); font-size:12px; font-weight:700; margin-bottom:14px; color:var(--gold);
    display:flex; align-items:center; gap:8px; letter-spacing:1.5px;
    padding-bottom:11px; border-bottom:1px dashed var(--line);
  }
  section h2::before{ content:'▍'; color:var(--gold); }
  .count{ margin-left:auto; font-family:var(--mono); font-size:11px; font-weight:800; color:#1a1206;
    background:var(--gold); border-radius:99px; padding:2px 9px; min-width:22px; text-align:center; }
  .count.zero{ background:#2a2c38; color:var(--dim); }

  .card {
    position:relative; border:1px solid var(--line-soft); border-radius:10px;
    padding:14px; margin-bottom:11px; background:linear-gradient(160deg,#12141d,#0c0e15);
  }
  .card .title { font-size:15.5px; font-weight:900; line-height:1.4; letter-spacing:.2px; }
  .card .sub { font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:4px; letter-spacing:.3px; }
  .card .row { display:flex; gap:8px; margin-top:13px; flex-wrap:wrap; }

  .btn {
    border:none; border-radius:8px; padding:10px 16px;
    font-size:14px; font-weight:800; font-family:var(--mono); letter-spacing:.8px; cursor:pointer;
    transition:transform .12s, box-shadow .12s;
  }
  .btn:active { transform:translateY(2px) scale(.97); }
  .btn.ok { background:linear-gradient(180deg,var(--gold-hi),var(--gold-deep)); color:#1a1206;
    box-shadow:0 0 0 1px rgba(233,196,106,.4), 0 6px 16px rgba(233,196,106,.16); }
  .btn.no { background:rgba(255,107,129,.12); color:var(--pink); border:1px solid rgba(255,107,129,.35); }
  .btn.gray { background:#181a24; color:var(--muted); border:1px solid var(--line-soft); }

  input, select {
    font-family:var(--mono); font-size:14px; letter-spacing:.3px;
    padding:12px 13px; border-radius:9px; border:1px solid var(--line);
    background:#0c0e15; color:var(--text); width:100%; margin-bottom:10px;
    transition:border-color .2s, box-shadow .2s;
  }
  input::placeholder{ color:var(--dim); }
  input:focus, select:focus { outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(233,196,106,.1); }
  select option{ background:#0c0e15; }

  .formRow { display:flex; gap:10px; }
  .formRow > * { flex:1; }

  .empty { font-family:var(--mono); color:var(--dim); font-size:13px; text-align:center; padding:16px 0; letter-spacing:1px; }

  .pill {
    display:inline-block; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.4px;
    padding:2px 9px; border-radius:5px; margin-left:6px; vertical-align:1px;
  }
  .pill.a { background:rgba(233,196,106,.12); color:var(--gold); border:1px solid rgba(233,196,106,.25); }
  .pill.grab { background:rgba(233,196,106,.08); color:var(--gold-dim); border:1px solid rgba(233,196,106,.2); }
  .pill.claimed { background:rgba(95,240,220,.12); color:var(--cyan); border:1px solid rgba(95,240,220,.3); }

  .coin { color:var(--gold); font-weight:800; font-family:var(--mono); }

  /* 玩家卡 */
  .pHead{ display:flex; align-items:center; gap:10px; }
  .pAv{ width:38px; height:38px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:16px; font-weight:800; color:var(--gold);
    background:linear-gradient(145deg,#14161f,#0c0e15); border:1px solid var(--line); }
  .pLv{ font-family:var(--mono); font-size:11px; font-weight:800; letter-spacing:.5px; color:#1a1206;
    background:linear-gradient(180deg,var(--gold-hi),var(--gold-deep)); border-radius:5px; padding:2px 8px;
    box-shadow:0 0 10px rgba(233,196,106,.25); }
  .pStats{ display:flex; gap:16px; margin-top:10px; flex-wrap:wrap; }
  .pStat{ font-family:var(--mono); font-size:12px; color:var(--muted); font-weight:600; }
  .pStat b{ color:var(--text); font-weight:800; }

  /* ===== 底部分頁 nav ===== */
  nav {
    position:relative; flex-shrink:0;
    display:flex; gap:2px; padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, #090a11, #07080d); border-top:1px solid var(--line);
  }
  nav::before{
    content:''; position:absolute; left:0; right:0; top:-1px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(233,196,106,.45), transparent);
  }
  nav button {
    position:relative; flex:1; padding:9px 0 7px; background:none; border:none; border-radius:8px;
    color:var(--dim); font-size:11px; font-weight:700; font-family:var(--mono); letter-spacing:1px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px; transition:color .2s;
  }
  nav button .ic{ font-size:18px; transition:transform .2s, filter .2s; filter:grayscale(.5) opacity(.7); }
  nav button.on { color:var(--gold); }
  nav button.on .ic{ transform:translateY(-1px); filter:drop-shadow(0 0 8px rgba(233,196,106,.6)); }
  nav button.on::before{
    content:''; position:absolute; top:1px; left:50%; transform:translateX(-50%);
    width:22px; height:2px; border-radius:2px; background:var(--gold); box-shadow:0 0 8px var(--gold);
  }
  nav button:active{ transform:scale(.94); }
  /* 審核紅點 */
  .navBadge{
    position:absolute; top:2px; right:calc(50% - 26px); min-width:17px; height:17px; padding:0 4px;
    display:none; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:10px; font-weight:800; color:#fff;
    background:var(--pink); border-radius:99px; box-shadow:0 0 10px rgba(255,107,129,.5);
  }
  .navBadge.show{ display:flex; }

  #toast {
    position:fixed; left:50%; bottom:84px; transform:translateX(-50%) translateY(8px);
    background:linear-gradient(180deg,#141620,#0c0e15); color:var(--gold); font-weight:700; font-family:var(--mono); font-size:14px; letter-spacing:.5px;
    padding:12px 22px; border-radius:9px; z-index:200; border:1px solid rgba(233,196,106,.5);
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
    box-shadow:0 0 26px rgba(233,196,106,.14), 0 8px 24px rgba(0,0,0,.6); max-width:85vw; text-align:center;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ===== 抽屜選單 ===== */
  #drawerMask{
    position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.6);
    opacity:0; pointer-events:none; transition:opacity .32s;
  }
  #drawerMask.show{ opacity:1; pointer-events:auto; }
  #drawer{
    position:fixed; left:0; right:0; bottom:0; z-index:301;
    background:linear-gradient(180deg,#12141d,#0a0b12);
    border-top:1px solid var(--line);
    border-radius:20px 20px 0 0; padding:10px 16px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .32s cubic-bezier(.22,1,.36,1);
    box-shadow:0 -10px 40px rgba(0,0,0,.6);
  }
  #drawer.show{ transform:translateY(0); }
  #drawer .grip{ width:38px; height:4px; border-radius:99px; background:#3a3f52; margin:0 auto 16px; }
  .drawerGrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:640px; margin:0 auto; }
  .drawerItem{
    position:relative; display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:16px 6px; border-radius:12px; cursor:pointer;
    background:linear-gradient(160deg,var(--panel-1),var(--panel-2));
    border:1px solid var(--line-soft); transition:transform .12s, border-color .2s;
  }
  .drawerItem:active{ transform:scale(.94); }
  .drawerItem.on{ border-color:rgba(233,196,106,.5); box-shadow:0 0 14px rgba(233,196,106,.14); }
  .drawerItem .dic{ font-size:24px; }
  .drawerItem .dname{ font-family:var(--mono); font-size:11.5px; font-weight:700; color:var(--text); letter-spacing:.5px; }

  /* ===== 倍率 / 罰單 ===== */
  .multPill{
    font-family:var(--mono); font-size:10.5px; font-weight:800; color:#ffcf6b;
    background:rgba(233,196,106,.12); border:1px solid rgba(233,196,106,.3);
    padding:2px 7px; border-radius:5px; margin-left:6px;
  }
  .card.lockCard{ border-color:rgba(255,107,129,.5); background:linear-gradient(160deg,#23131a,#120a0e); }
  .card.reported{ border-color:rgba(255,107,129,.85); box-shadow:0 0 20px rgba(255,107,129,.22); }
  .dot{ display:inline-block; width:7px; height:7px; border-radius:99px; background:var(--pink);
    box-shadow:0 0 8px var(--pink); margin-right:6px; vertical-align:1px; }
  .pill.fine{ background:rgba(233,196,106,.12); color:var(--gold); border:1px solid rgba(233,196,106,.28); }
  .pill.lock{ background:rgba(255,107,129,.13); color:var(--pink); border:1px solid rgba(255,107,129,.3); }
  .segRow{ display:flex; gap:8px; margin-bottom:10px; }
  .segRow button{
    flex:1; padding:11px 0; border:1px solid var(--line); border-radius:9px;
    background:#0d0f17; color:var(--muted); font-family:var(--mono); font-size:13px; font-weight:700; cursor:pointer;
  }
  .segRow button.on{ background:linear-gradient(180deg,var(--gold-hi),var(--gold-deep)); color:#1a1206; border-color:transparent; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001s !important; transition-duration:.05s !important; }
    body::before{ display:none; }
  }
</style>
</head>
<body>

<div id="lockOverlay">
  <div class="lockIcon">🔐</div>
  <h1>ADMIN</h1>
  <div class="hint">請輸入密碼</div>
  <input type="password" id="pwInput" placeholder="輸入密碼">
  <button id="pwBtn">進入</button>
</div>

<header>
  <span class="dot">👩‍🏫</span>
  <span class="htxt">TASKBOARD</span>
  <span class="htag">ADMIN</span>
</header>

<main>
  <!-- 審核頁 -->
  <div class="page on" id="page-review">
    <section>
      <h2>待審核的任務回報 <span class="count zero" id="cReview">0</span></h2>
      <div id="reviewList"></div>
    </section>
    <section>
      <h2>待核銷（玩家已按使用） <span class="count zero" id="cBuy">0</span></h2>
      <div id="buyReviewList"></div>
    </section>
  </div>

  <!-- 任務頁 -->
  <div class="page" id="page-tasks">
    <section>
      <h2>每日任務模板 <span class="count zero" id="cTpl">0</span></h2>
      <input id="dTitle" placeholder="每日任務標題（例：每日作業）">
      <div class="formRow">
        <input id="dReward" type="number" min="1" placeholder="金幣獎勵">
        <input id="dNote" placeholder="說明（選填）">
      </div>
      <button class="btn ok" id="addTplBtn" style="width:100%">建立模板</button>
      <div id="tplList" style="margin-top:14px"></div>
    </section>
    <section>
      <h2>發布新任務</h2>
      <input id="tTitle" placeholder="任務內容（例：寫數學考卷一張）">
      <div class="formRow">
        <input id="tReward" type="number" min="1" placeholder="金幣獎勵">
        <select id="tAssignee"></select>
      </div>
      <button class="btn ok" id="addTaskBtn" style="width:100%">發布任務</button>
    </section>
    <section>
      <h2>進行中的任務 <span class="count zero" id="cTask">0</span></h2>
      <div id="taskList"></div>
    </section>
  </div>

  <!-- 商店頁 -->
  <div class="page" id="page-shop">
    <section>
      <h2>商店管理 <span class="count zero" id="cShop">0</span></h2>
      <input id="sName" placeholder="商品名稱（例：手機時間 30 分鐘）">
      <input id="sCat" list="catList" placeholder="分類（選填，例：手機時間）">
      <datalist id="catList"></datalist>
      <div class="formRow">
        <input id="sPrice" type="number" min="1" placeholder="價格（金幣）">
        <input id="sDesc" placeholder="說明（選填）">
      </div>
      <button class="btn ok" id="addItemBtn" style="width:100%">上架商品</button>
      <div id="shopList" style="margin-top:14px"></div>
    </section>
  </div>

  <!-- 玩家頁 -->
  <div class="page" id="page-players">
    <section>
      <h2>玩家管理 <span class="count zero" id="cPlayer">0</span></h2>
      <div id="playerList"></div>
    </section>
  </div>

  <!-- 罰單頁 -->
  <div class="page" id="page-penalty">
    <section>
      <h2>開罰單</h2>
      <select id="fPlayer"></select>
      <div class="segRow">
        <button class="on" id="typeFine">💸 罰款</button>
        <button id="typeLock">🔒 禁閉</button>
      </div>
      <input id="fReason" placeholder="事由（例：沒洗碗）">
      <input id="fAmount" type="number" min="1" placeholder="罰款金額（金幣）">
      <input id="fTask" placeholder="贖罪任務內容（例：把廁所洗乾淨）" style="display:none">
      <button class="btn ok" id="addPenBtn" style="width:100%">送出罰單</button>
    </section>
    <section>
      <h2>進行中的禁閉 <span class="count zero" id="cLock">0</span></h2>
      <div id="lockList"></div>
    </section>
    <section>
      <h2>罰單紀錄（最近 30 筆）</h2>
      <div id="penLog"></div>
    </section>
  </div>
</main>

<nav>
  <button class="on" data-p="review"><span class="ic">⏳</span>審核<span class="navBadge" id="navReview">0</span></button>
  <button data-p="tasks"><span class="ic">📌</span>任務</button>
  <button data-p="shop"><span class="ic">🛒</span>商店</button>
  <button id="moreBtn"><span class="ic">☰</span>更多<span class="navBadge" id="navMore">0</span></button>
</nav>

<!-- 抽屜 -->
<div id="drawerMask"></div>
<div id="drawer">
  <div class="grip"></div>
  <div class="drawerGrid">
    <div class="drawerItem" data-p="penalty"><span class="dic">🔒</span><span class="dname">罰單</span><span class="navBadge" id="drawerPenBadge" style="top:6px;right:10px">0</span></div>
    <div class="drawerItem" data-p="players"><span class="dic">👦</span><span class="dname">玩家</span></div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc,
  onSnapshot, runTransaction, serverTimestamp, query, orderBy, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== firebaseConfig（跟 index.html 同一份，不動） ====== */
const firebaseConfig = {
  apiKey: "AIzaSyCMjNCwB1jC8S-wgCMQ2wnkdZxG22Gg10c",
  authDomain: "game-b556f.firebaseapp.com",
  projectId: "game-b556f",
  storageBucket: "game-b556f.firebasestorage.app",
  messagingSenderId: "162254677726",
  appId: "1:162254677726:web:5371b0c883d8b81b99844f"
};
/* ====== 後台密碼 ====== */
const ADMIN_PASSWORD = "0414";

/* ===== 記帳（ledger）：只新增紀錄，不影響任何既有邏輯 ===== */
function ledgerData(playerId, kind, delta, label, meta){
  return { playerId, kind, delta, label: label || '', meta: meta || {}, createdAt: serverTimestamp() };
}
const ledgerRef = () => doc(collection(db,'ledger'));
/* ================================================================ */

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let players = {};
let tasks = [];
let shopItems = [];
let purchases = [];

/* 裝備制：全站只能裝一個稱號 */
function equippedTitle(p){
  const id = p && p.equippedTitle;
  if(!id) return null;
  const c = CRAFT_TITLES.find(t => t.id === id);
  if(c) return { kind:'craft', id, icon:c.icon, name:c.name, mult:c.mult, luck:1.0 };
  const s = SHOP_TITLES.find(t => t.id === id);
  if(s) return { kind:'shop', id, icon:'', name:s.name, tier:s.tier, mult:1.0, luck:TIERS[s.tier].luck };
  return null;
}
function titleBonus(p){ return equippedTitle(p)?.mult || 1.0; }   // 只看裝備中的合成稱號
function luckOf(p){ return equippedTitle(p)?.luck || 1.0; }       // 只看裝備中的商店稱號
function achievementBonus(p){
  return (((p && p.achievements) || []).length >= ACHIEVEMENT_TOTAL) ? 1.1 : 1.0;
}
function finalMultiplier(p){
  return Math.round(achievementBonus(p) * titleBonus(p) * 1000) / 1000;
}

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* 等級（跟前台同公式，只用來顯示） */
function xpThreshold(lv){ return 50 * (lv - 1) * (lv + 2); }
function levelFromXp(xp){ let lv=1; while(xp >= xpThreshold(lv+1)) lv++; return lv; }

function setCount(el, n){

function todayKey(){
  return new Date().toLocaleDateString('en-CA', { timeZone:'Asia/Taipei' });
}
function prevKey(dateKey){
  return new Date(new Date(dateKey).getTime() - 86400000).toISOString().slice(0,10);
}

// 對每個 active 模板 × 每個玩家補生成當日實例 + 過期所有玩家舊 open 每日任務
function ensureAllDailyTasks(){
  if(!adminUnlocked) return;
  const ids = Object.keys(players);
  if(!ids.length) return;
  const today = todayKey();
  for(const tpl of dailyTemplates){
    if(!tpl.active) continue;
    for(const pid of ids){
      const id = `daily_${tpl.id}_${pid}_${today}`;
      if(tasks.some(t => t.id === id)) continue;
      setDoc(doc(db,'tasks',id), {
        isDaily:true, templateId:tpl.id, dateKey:today,
        title:tpl.title, reward:tpl.reward, note:tpl.note || '',
        assignee:pid, status:'open', claimedBy:null, wasRejected:false,
        createdAt: serverTimestamp()
      }).catch(()=>{});
    }
  }
  for(const t of tasks){
    if(t.isDaily && t.status==='open' && t.dateKey < today){
      updateDoc(doc(db,'tasks',t.id), { status:'expired' }).catch(()=>{});
    }
  }
}
let allDailyTimer = null;
function scheduleEnsureAll(){ clearTimeout(allDailyTimer); allDailyTimer = setTimeout(ensureAllDailyTasks, 500); }
let lastDayKeyA = todayKey();
setInterval(()=>{
  const k = todayKey();
  if(k !== lastDayKeyA){ lastDayKeyA = k; scheduleEnsureAll(); }
}, 60000);

/* ===== 審核任務（★ 通過時同步累加 coins / totalEarned / xp / tasksDone）===== */
window.approveTask = async (id)=>{
  const t = tasks.find(x=>x.id===id);
  if(t){
    const payee = t.claimedBy || t.assignee;
    const who = pName(payee);
    const m = finalMultiplier(players[payee]);
    const payout = Math.round(t.reward * m);
    const extra = m > 1 ? `（${t.reward} × ${m}）` : '';
    if(!confirm(`確定通過「${t.title}」？\n將發給 ${who} 🪙 ${payout}${extra}`)) return;
  }
  try {
    await runTransaction(db, async tx=>{
      const ref = doc(db,'tasks',id);
      const s = await tx.get(ref);
      if(!s.exists()) throw new Error('任務不存在');
      const t = s.data();
      if(t.status!=='pending') throw new Error('狀態已變更');
      const payee = t.claimedBy || t.assignee;
      if(!payee || payee==='all') throw new Error('找不到領獎的人');
      const pRef = doc(db,'players',payee);
      const ps = await tx.get(pRef);                 // read 一律在 write 之前
      const pd = (ps.exists() && ps.data()) || {};

      // 最終倍率 = 成就全解加成 × 稱號最高倍率（相乘）
      const mult = finalMultiplier(pd);
      const payout = Math.round(t.reward * mult);

      // 每日任務：streak 連續性用任務 dateKey，不是審核當下
      let streakUpdate = {};
      if(t.isDaily && t.templateId && t.dateKey){
        const streaks = pd.dailyStreaks || {};
        const cur = streaks[t.templateId] || { count:0, lastDate:null };
        let count;
        if(cur.lastDate === t.dateKey)             count = cur.count;        // 防重複（理論上不會發生）
        else if(cur.lastDate === prevKey(t.dateKey)) count = (cur.count||0)+1; // 昨天有做 → 續
        else                                        count = 1;                // 斷了 → 重算
        streakUpdate['dailyStreaks.'+t.templateId] = { count, lastDate: t.dateKey };
      }

      tx.update(ref, { status:'done' });
      tx.update(pRef, {
        coins:       increment(payout),
        totalEarned: increment(payout),     // 用發放後金額累加
        xp:          increment(payout),     // XP 同樣吃倍率
        tasksDone:   increment(1),
        ...streakUpdate
      });
      tx.set(ledgerRef(), ledgerData(payee, t.isDaily ? 'daily' : 'task', payout, t.title, { mult, base: t.reward }));
    });
    toast('已通過，金幣入帳 🪙');
  } catch(e){ toast(e.message); }
};

// 依分類分組（組間最低價、其他最後；組內價格低到高）
function groupByCategory(items){
  const groups = {};
  items.forEach(i=>{
    const c = (i.category && i.category.trim()) || '其他';
    (groups[c] || (groups[c] = [])).push(i);
  });
  Object.values(groups).forEach(arr => arr.sort((a,b)=> (a.price||0) - (b.price||0)));
  return Object.entries(groups).sort((a,b)=>{
    if(a[0]==='其他') return 1;
    if(b[0]==='其他') return -1;
    const minA = Math.min(...a[1].map(x=>x.price||0));
    const minB = Math.min(...b[1].map(x=>x.price||0));
    return minA - minB;
  });
}

function renderShop(){
  setCount('cShop', shopItems.length);

  // datalist：現有分類去重，讓上架時可直接選舊分類避免分裂
  const cats = [...new Set(shopItems.map(i => (i.category||'').trim()).filter(Boolean))].sort();
  $('catList').innerHTML = cats.map(c=>`<option value="${esc(c)}">`).join('');

  if(!shopItems.length){ $('shopList').innerHTML = '<div class="empty">還沒有商品</div>'; return; }
  $('shopList').innerHTML = groupByCategory(shopItems).map(([cat, items])=>
    `<h2 style="margin:16px 0 10px">${esc(cat)}</h2>` + items.map(i=>`
    <div class="card">
      <div class="title">${esc(i.name)}</div>
      <div class="sub"><span class="coin">🪙 ${i.price}</span>・${esc(cat)}${i.desc ? '・'+esc(i.desc) : ''}</div>
      <div class="row"><button class="btn gray" onclick="delItem('${i.id}')">下架</button></div>
    </div>`).join('')
  ).join('');
}

/* ==================================================================
   罰單系統
================================================================== */
let penType = 'fine';
$('typeFine').onclick = ()=>{
  penType = 'fine';
  $('typeFine').classList.add('on'); $('typeLock').classList.remove('on');
  $('fAmount').style.display = ''; $('fTask').style.display = 'none';
};
$('typeLock').onclick = ()=>{
  penType = 'lock';
  $('typeLock').classList.add('on'); $('typeFine').classList.remove('on');
  $('fAmount').style.display = 'none'; $('fTask').style.display = '';
};

function renderPenaltySelect(){
  const sel = $('fPlayer');
  const cur = sel.value;
  sel.innerHTML = Object.entries(players).map(([id,p])=>
    `<option value="${id}">${esc(p.name)}</option>`
  ).join('');
  if(cur) sel.value = cur;
}

$('addPenBtn').onclick = async ()=>{
  const pid = $('fPlayer').value;
  const reason = $('fReason').value.trim();
  if(!pid) return toast('要先選玩家');
  if(!reason) return toast('要填事由');

  if(penType === 'fine'){
    const amount = parseInt($('fAmount').value);
    if(!amount || amount < 1) return toast('罰款金額要大於 0');
    const after = (players[pid]?.coins ?? 0) - amount;
    if(!confirm(`確定罰「${players[pid]?.name}」🪙 ${amount}？\n餘額將變成 ${after}`)) return;
    try {
      await runTransaction(db, async tx=>{
        const pRef = doc(db,'players',pid);
        const s = await tx.get(pRef);
        if(!s.exists()) throw new Error('玩家不存在');
        tx.update(pRef, { coins: increment(-amount) });      // 允許扣成負數（負債）
        const ref = doc(collection(db,'penalties'));
        tx.set(ref, {
          playerId:pid, type:'fine', reason, amount,
          status:'cleared', createdAt: serverTimestamp(), clearedAt: serverTimestamp()
        });
        tx.set(ledgerRef(), ledgerData(pid, 'penalty', -amount, reason));
      });
      $('fReason').value=''; $('fAmount').value='';
      toast('已開罰單並扣款 💸');
    } catch(e){ toast(e.message); }
  } else {
    const taskTitle = $('fTask').value.trim();
    if(!taskTitle) return toast('要填贖罪任務內容');
    if(penalties.some(p=>p.playerId===pid && p.type==='lock' && p.status!=='cleared'))
      return toast('這個人已經在禁閉中了');
    if(!confirm(`確定把「${players[pid]?.name}」關禁閉？\n事由：${reason}\n贖罪任務：${taskTitle}`)) return;
    try {
      await addDoc(collection(db,'penalties'), {
        playerId:pid, type:'lock', reason, taskTitle,
        status:'active', createdAt: serverTimestamp()
      });
      $('fReason').value=''; $('fTask').value='';
      toast('已開禁閉 🔒');
    } catch(e){ toast(e.message); }
  }
};

window.clearLock = async (id)=>{
  const p = penalties.find(x=>x.id===id);
  if(!p) return;
  if(!confirm(`確定解除「${pName(p.playerId)}」的禁閉？`)) return;
  await updateDoc(doc(db,'penalties',id), { status:'cleared', clearedAt: serverTimestamp() });
  toast('已解除禁閉 ✅');
};
window.rejectLock = async (id)=>{
  await updateDoc(doc(db,'penalties',id), { status:'active' });
  toast('已退回，請他重做');
};

function renderPenalties(){
  renderPenaltySelect();

  // 進行中的禁閉：待確認(reported)排最上面
  const locks = penalties.filter(p=>p.type==='lock' && p.status!=='cleared')
    .sort((a,b)=> (b.status==='reported') - (a.status==='reported'));
  setCount('cLock', locks.length);
  $('lockList').innerHTML = locks.length ? locks.map(p=>{
    const rep = p.status==='reported';
    return `<div class="card lockCard ${rep?'reported':''}">
      <div class="title">${rep?'<span class="dot"></span>':''}${esc(pName(p.playerId))} <span class="pill lock">${rep?'已回報':'禁閉中'}</span></div>
      <div class="sub">事由：${esc(p.reason||'—')}</div>
      <div class="sub">贖罪任務：${esc(p.taskTitle||'—')}</div>
      <div class="row">
        <button class="btn ok" onclick="clearLock('${p.id}')">✅ 解除禁閉</button>
        ${rep ? `<button class="btn no" onclick="rejectLock('${p.id}')">↩️ 退回</button>` : ''}
      </div>
    </div>`;
  }).join('') : '<div class="empty">目前沒有人在禁閉</div>';

  // 罰單紀錄（最近 30 筆）
  const log = penalties.slice(0,30);
  $('penLog').innerHTML = log.length ? log.map(p=>{
    const d = p.createdAt?.toDate ? p.createdAt.toDate() : null;
    const ds = d ? `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` : '—';
    const st = { active:'進行中', reported:'待確認', cleared:'已解除' }[p.status] || p.status;
    return `<div class="card">
      <div class="title">${esc(pName(p.playerId))} <span class="pill ${p.type}">${p.type==='fine'?'💸 罰款':'🔒 禁閉'}</span></div>
      <div class="sub">${esc(p.reason||'—')}</div>
      <div class="sub">${p.type==='fine' ? `扣款 <span class="coin">🪙 ${p.amount??0}</span>` : `贖罪：${esc(p.taskTitle||'—')}・${st}`}・${ds}</div>
    </div>`;
  }).join('') : '<div class="empty">還沒有罰單紀錄</div>';
}

/* ===== 玩家管理 ===== */
window.renamePlayer = async (id)=>{
  const name = prompt('新名字：', players[id]?.name || '');
  if(!name || !name.trim()) return;
  await updateDoc(doc(db,'players',id), { name: name.trim() });
  toast('已改名');
};
window.adjustCoins = async (id)=>{
  const v = prompt(`調整 ${players[id]?.name} 的金幣（正數加、負數扣）：`, '');
  const n = parseInt(v);
  if(!n) return;
  await updateDoc(doc(db,'players',id), { coins: increment(n) });
  addDoc(collection(db,'ledger'), ledgerData(id, 'admin', n, '後台手動調整')).catch(()=>{});
  toast(n>0 ? `已加 ${n} 🪙` : `已扣 ${-n} 🪙`);
};
window.resetPw = async (id)=>{
  if(!confirm(`要重設「${players[id]?.name}」的密碼嗎？\n他下次登入時輸入的密碼會變成新密碼。`)) return;
  await updateDoc(doc(db,'players',id), { pw: null });
  toast('已重設，下次登入重新綁定');
};
window.delPlayer = async (id)=>{
  if(!confirm(`確定刪除帳號「${players[id]?.name}」？金幣會一起消失，不能復原！`)) return;
  await deleteDoc(doc(db,'players',id));
  toast('已刪除帳號');
};

let expandedPlayer = null;                    // 同時只展開一個
window.togglePlayer = (id)=>{
  expandedPlayer = (expandedPlayer === id) ? null : id;
  renderPlayers();
};

function renderPlayers(){
  const list = Object.entries(players);
  setCount('cPlayer', list.length);
  $('playerList').innerHTML = list.length ? list.map(([id,p])=>{
    const lv = levelFromXp(p.xp ?? 0);
    const av = esc((p.name||id).trim()[0] || '?');
    const coins = p.coins ?? 0;
    const open = expandedPlayer === id;

    // 收合狀態：只有頭像 + 名字 + Lv + 金幣（清爽，不顯示按鈕避免誤觸刪除）
    const head = `
      <div class="pHead" onclick="togglePlayer('${esc(id)}')" style="cursor:pointer">
        <div class="pAv">${av}</div>
        <div style="flex:1;min-width:0">
          <div class="title" style="display:flex;align-items:center;gap:8px">
            ${esc(p.name)} <span class="pLv">Lv.${lv}</span>
          </div>
          <div class="sub">ID：${esc(id)}・<span class="coin" style="${coins<0?'color:var(--pink)':''}">🪙 ${coins}</span>${coins<0?' <b style="color:var(--pink)">負債</b>':''}</div>
        </div>
        <div style="color:var(--gold);font-family:var(--mono);font-size:15px">${open?'▴':'▾'}</div>
      </div>`;

    if(!open) return `<div class="card">${head}</div>`;

    /* ---- ① 資產 ---- */
    const mine = purchases.filter(x => x.playerId===id);
    const tickets = mine.filter(x => x.status==='owned' && x.isTicket===true).length;
    const ownedItems = mine.filter(x => x.status==='owned' && !x.isTicket);
    const pendItems  = mine.filter(x => x.status==='pending');
    const usedItems  = mine.filter(x => x.status==='redeemed').slice(0,5);
    const mats = p.materials || {};
    const matLine = MATERIALS.map(m=>{
      const have = mats[m.key] ?? 0;
      const full = have >= m.need;
      return `<span style="${full?'color:var(--gold);font-weight:800':''}">${m.icon} ${have}/${m.need}</span>`;
    }).join('　');

    /* ---- ② 遊戲進度 ---- */
    const xp = p.xp ?? 0;
    const floor = xpThreshold(lv), ceil = xpThreshold(lv+1);
    const ach = (p.achievements || []).length;
    const ab = achievementBonus(p), tb = titleBonus(p), fm = finalMultiplier(p);
    const eq = equippedTitle(p);
    const crafted = p.craftedTitles || {};
    const craftLine = CRAFT_TITLES.filter(t=>(crafted[t.id]||0)>0)
      .map(t=>`${t.icon}${esc(t.name)}${(crafted[t.id]>1)?' ×'+crafted[t.id]:''}`).join('、') || '無';
    const shopCount = (p.shopTitles || []).length;
    const pity = p.lotteryPity ?? 0;

    /* ---- ③ 紀律 ---- */
    const myPen = penalties.filter(x => x.playerId===id).slice(0,10);
    const locked = penalties.some(x => x.playerId===id && x.type==='lock' && x.status!=='cleared');

    const line = (label, val) => `<div class="pStat" style="width:100%">${label} <b>${val}</b></div>`;

    return `
    <div class="card">
      ${head}
      <div style="margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)">

        <h2 style="font-size:11px;margin-bottom:10px">① 資產</h2>
        <div class="pStats" style="flex-direction:column;gap:7px">
          ${line('金幣', `<span class="coin" style="${coins<0?'color:var(--pink)':''}">🪙 ${coins}</span>${coins<0?' <span style="color:var(--pink)">負債</span>':''}`)}
          ${line('抽獎券', `🎟️ ×${tickets}`)}
          ${line('材料', matLine)}
          ${line('可使用', ownedItems.length ? ownedItems.map(x=>esc(x.itemName)).join('、') : '無')}
          ${line('<span style="color:var(--gold)">待核銷</span>', pendItems.length ? `<span style="color:var(--gold)">${pendItems.map(x=>esc(x.itemName)).join('、')}</span>` : '無')}
          ${line('最近已核銷', usedItems.length ? usedItems.map(x=>esc(x.itemName)).join('、') : '無')}
        </div>

        <h2 style="font-size:11px;margin:16px 0 10px">② 遊戲進度</h2>
        <div class="pStats" style="flex-direction:column;gap:7px">
          ${line('等級', `Lv.${lv}　${xp - floor} / ${ceil - floor} XP`)}
          ${line('成就', `${ach} / ${ACHIEVEMENT_TOTAL}`)}
          ${line('倍率', `⭐×${fm}　<span style="color:var(--muted);font-weight:600">（成就 ×${ab} × 稱號 ×${tb}）</span>`)}
          ${line('幸運', `🍀 ×${luckOf(p)}`)}
          ${line('抽獎', `${p.lotteryCount ?? 0} 次　pity ${pity}/${PITY_MAX}`)}
          ${line('合成稱號', craftLine)}
          ${line('商店稱號', `${shopCount} 個`)}
          ${line('裝備中', eq ? `${eq.icon} ${esc(eq.name)}` : '未裝備')}
        </div>

        <h2 style="font-size:11px;margin:16px 0 10px">③ 紀律 ${locked?'<span class="pill lock">禁閉中</span>':''}</h2>
        ${myPen.length ? myPen.map(x=>{
          const d = x.createdAt?.toDate ? x.createdAt.toDate() : null;
          const ds = d ? `${d.getMonth()+1}/${d.getDate()}` : '—';
          return `<div class="pStat" style="width:100%">
            <span class="pill ${x.type}">${x.type==='fine'?'罰款':'禁閉'}</span>
            ${esc(x.reason||'—')}${x.type==='fine'?`・🪙 ${x.amount??0}`:''}・${ds}</div>`;
        }).join('') : '<div class="empty" style="padding:8px 0">沒有罰單紀錄</div>'}

        <h2 style="font-size:11px;margin:16px 0 10px">④ 操作</h2>
        <div class="row">
          <button class="btn gray" onclick="renamePlayer('${esc(id)}')">改名</button>
          <button class="btn gray" onclick="adjustCoins('${esc(id)}')">調整金幣</button>
          <button class="btn gray" onclick="resetPw('${esc(id)}')">重設密碼</button>
          <button class="btn no" onclick="delPlayer('${esc(id)}')">刪除</button>
        </div>
      </div>
    </div>`;
  }).join('') : '<div class="empty">還沒有人註冊。叫弟弟打開前台輸入 ID + 密碼註冊。</div>';
}
</script>
